<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Job</title>
     
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" 
        rel="stylesheet" 
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" 
        crossorigin="anonymous"
    />
    <link rel="stylesheet" href="devboard.css" />
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">

        <!-- navbar-expand-lg = collapses nav to hamburger below 932px -->
        <!-- bg-white=> background white -->
        <!-- sticky-top=> sticky nav top 0  -->
        <div class="container">
            <a href="#" class="navbar-brand fw-fold bg"
            >Dev<span class="text-accent">Board</span></a>

            <!-- navbar-brand = styles the logo or site name and removes the underline -->
             <!-- fw-bold= font-weight fold -->

             <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-menu="#navMenu"
             ></button>
             <span class="navbar-toggler-icon"></span>
             <!-- navbar-toggler = this is hamburger menu -->
             <!-- data-bs-toggle = tell bootstrap js for toggle visibility  -->
             <!-- data-bs-menu = tells which element to target -->

             <div class="collapse navbar-collapse" id="navMenu">
                <div class="ms-auto">
                    <a href="#" class="btn btn-danger rounded-pill fw-semibold" px-4
                    >Post a job</a>
                    <!-- btn-accent = our custom class -->
                    <!-- rounded-pill = border-radius 999px -->
                    <!-- px-4 = padding left and padding right 1.5rem -->
                </div>
             </div>
             <!-- navMenu = used for targetting -->
             <!-- navbar-collapse = marks it as a collapsable part of the navbar -->
        </div>
    </nav>
    <!-- end of navbar -->

    <header class="py-5 text-center page-header">
        <!-- py-5 = padding top and padding bottom  -->
         <div class="container">
            <span class="badge rounded-pill bg-accent-subtle text-accent px-3 py-2 mb-3"
            >
            24 roles open</span
            >
            <!-- badge = bootstrap class for badge -->
            <!-- bg-accent-subtle and tect accent = our custom class -->
            <!-- mb-3 = margin bottom -->
         </div>
    </header>
</body>
</html>
